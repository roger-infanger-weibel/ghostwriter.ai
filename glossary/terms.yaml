    Muster mehr erkennt.
  explanation_en: A state where a model learns the training data so precisely that it no longer recognizes
    new patterns.
  context_de: Führt dazu, dass die KI bei bekannten Daten perfekt arbeitet, aber bei neuen Aufgaben komplett
    versagt.
