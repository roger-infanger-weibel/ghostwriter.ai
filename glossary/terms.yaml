  status: active
  term_de: Big Data
  term_en: Big Data
  explanation_de: Riesige Datenmengen, zu komplex fuer normale Programme.
  explanation_en: Enormous volumes of data, too complex for normal programs.
  context_de: Treibstoff fuer KI-Training.
  context_en: The fuel for AI training.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.coursera.org/de-DE/articles/ai-vs-deep-learning-vs-machine-learning-beginners-guide
