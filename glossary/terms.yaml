terms:
- id: kuenstliche-intelligenz
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Kuenstliche Intelligenz
  term_en: Artificial Intelligence (AI)
  explanation_de: Computersysteme, die menschliche Faehigkeiten wie Sehen, Sprechen oder Entscheiden nachahmen.
  explanation_en: Computer systems that mimic human abilities such as seeing, speaking, or making decisions.
  context_de: Der umfassende Oberbegriff.
  context_en: The umbrella term for the whole field.
  sources:
  - https://moterra.ai/blog/ai-map-simplified-understanding-ai-ml-dl-and-genai
  - https://www.din.de/resource/blob/772610/e96445ca1cbb372071981604ca9f07a2/normungsroadmap-ki-data.pdf
  updated: '2026-09-03'
- id: maschinelles-lernen
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Maschinelles Lernen
  term_en: Machine Learning (ML)
  explanation_de: Systeme lernen automatisch aus Mustern in Daten, statt explizit programmiert zu werden.
  explanation_en: Systems learn automatically from patterns in data instead of being explicitly programmed.
  context_de: Teilmenge der KI.
  context_en: A subset of AI.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.coursera.org/de-DE/articles/ai-vs-deep-learning-vs-machine-learning-beginners-guide
  updated: '2026-09-03'
- id: tiefes-lernen
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Tiefes Lernen
  term_en: Deep Learning (DL)
  explanation_de: ML mit kuenstlichen neuronalen Netzen, die viele Schichten („tief“) besitzen.
  explanation_en: ML using artificial neural networks with many layers ("deep").
  context_de: Teilmenge von ML.
  context_en: A subset of ML.
  sources:
  - https://www.coursera.org/de-DE/articles/ai-vs-deep-learning-vs-machine-learning-beginners-guide
  - https://www.youtube.com/watch?v=KI-Lernen
  updated: '2026-09-03'
- id: generative-ki
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Generative KI
  term_en: Generative AI (GenAI)
  explanation_de: Eine Form der KI, die neue Inhalte (Texte, Bilder, Musik, Code) erschaft.
  explanation_en: A form of AI that creates new content (text, images, music, code).
  context_de: Teilbereich der KI.
  context_en: A branch of AI.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://digitaleneuordnung.de/blog/ki-begriffe
  updated: '2026-09-03'
- id: starke-ki
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Starke KI
  term_en: General AI (AGI)
  explanation_de: Eine theoretische KI, die jede kognitive Aufgabe so gut wie ein Mensch loesen kann.
  explanation_en: A theoretical AI that could solve any cognitive task as well as a human.
  context_de: Fernziel der Forschung.
  context_en: A long-term research goal.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://our-languages.canada.ca/en/artificial-intelligence-terminology-concept-map-eng
  updated: '2026-09-03'
- id: schwache-ki
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Schwache KI
  term_en: Narrow AI (ANI)
  explanation_de: KI, die fuer eine ganz spezifische Aufgabe (z.B. Schach) optimiert ist.
  explanation_en: AI optimized for one very specific task (e.g. chess).
  context_de: Fast alle heutigen Systeme.
  context_en: Almost all of today's systems.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://www.din.de/resource/blob/772610/e96445ca1cbb372071981604ca9f07a2/normungsroadmap-ki-data.pdf
  updated: '2026-09-03'
- id: superintelligenz
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Superintelligenz
  term_en: Superintelligence (ASI)
  explanation_de: Eine KI, die die menschliche Intelligenz in allen Bereichen weit uebertrifft.
  explanation_en: An AI that far exceeds human intelligence in every domain.
  context_de: Folgt theoretisch auf die AGI.
  context_en: Theoretically follows AGI.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: singularitaet
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Singularitaet
  term_en: Singularity
  explanation_de: Zeitpunkt, ab dem KI sich so schnell selbst verbessert, dass Menschen nicht mehr folgen
    koennen.
  explanation_en: The point at which AI improves itself so fast that humans can no longer keep up.
  context_de: Zukunftsszenario (ca. 2045).
  context_en: A future scenario (around 2045).
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: turing-test
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Turing-Test
  term_en: Turing Test
  explanation_de: 'Ein Test von 1950: Kann eine KI im Chat so tun, als sei sie ein Mensch?.'
  explanation_en: 'A 1950 test: can an AI convince a human it is human in chat?'
  context_de: Historischer Masstab fuer Intelligenz.
  context_en: A historical benchmark for intelligence.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: algorithmus
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Algorithmus
  term_en: Algorithm
  explanation_de: Eine genaue Schritt-fuer-Schritt-Vorschrift zur Loesung einer Aufgabe.
  explanation_en: A precise, step-by-step procedure for solving a task.
  context_de: Mathematische Basis jeder Software.
  context_en: The mathematical basis of every piece of software.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.din.de/resource/blob/772610/e96445ca1cbb372071981604ca9f07a2/normungsroadmap-ki-data.pdf
  updated: '2026-09-03'
- id: kuenstliche-allgemeine-intelligenz
  category: 1-grundlagen-and-kernkonzepte
  status: active
  term_de: Künstliche allgemeine Intelligenz
  term_en: Artificial General Intelligence (AGI)
  explanation_de: Eine theoretische KI, die jede intellektuelle Aufgabe eines Menschen in allen Bereichen
    erfüllen kann.
  explanation_en: A theoretical AI able to perform any intellectual task a human can, across all domains.
  context_de: Gilt als "heiliger Gral" der KI-Forschung; existiert zum heutigen Stand noch nicht.
  context_en: Considered the "holy grail" of AI research; does not exist yet today.
  sources:
  - https://www.zendesk.de/blog/ai/generative-ai-glossary/
  updated: '2026-09-03'
- id: basismodell
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Basismodell
  term_en: Foundation Model
  explanation_de: Massiv trainierte Modelle, die als breite technologische Basis für viele verschiedene
    Anwendungen dienen.
  explanation_en: Massively trained models that serve as a broad technological base for many different
    applications.
  context_de: Ermöglicht es, ein einzelnes Modell (z. B. GPT-4) für hunderte verschiedene Aufgaben einzusetzen.
  context_en: Lets a single model (e.g. GPT-4) be used for hundreds of different tasks.
  sources:
  - https://joerg-loehr.com/ki-glossar
  updated: '2026-09-03'
- id: grosses-sprachmodell
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Grosses Sprachmodell
  term_en: Large Language Model (LLM)
  explanation_de: Ein riesiges neuronales Netz, das darauf trainiert wurde, Sprache zu verstehen und zu
    erzeugen.
  explanation_en: A huge neural network trained to understand and generate language.
  context_de: Basis fuer ChatGPT, Claude etc..
  context_en: The basis for ChatGPT, Claude, etc.
  sources:
  - https://mdai.ch/blog/von-llm-bis-halluzination/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: sprachverarbeitung
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Sprachverarbeitung
  term_en: Natural Language Processing (NLP)
  explanation_de: Ein KI-Feld, das Computern hilft, menschliche Sprache zu verstehen, zu interpretieren
    und zu erzeugen.
  explanation_en: An AI field that helps computers understand, interpret, and generate human language.
  context_de: Ermöglicht Funktionen wie Textklassifizierung, Stimmungsanalyse und automatisierte Übersetzung.
  context_en: Enables functions like text classification, sentiment analysis, and automated translation.
  sources:
  - https://www.zendesk.de/blog/ai/generative-ai-glossary/
  updated: '2026-09-03'
- id: wissensgraph
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Wissensgraph
  term_en: Knowledge Graph
  explanation_de: Eine semantische Netzwerkstruktur, die Informationen und deren Beziehungen grafisch
    darstellt.
  explanation_en: A semantic network structure that graphically represents information and its relationships.
  context_de: Erlaubt es KI-Systemen, Informationen über Knoten (Entitäten) und Kanten (Beziehungen) logisch
    zu verknüpfen.
  context_en: Lets AI systems logically link information via nodes (entities) and edges (relationships).
  sources:
  - https://ki-zentrum.ch/studien
  updated: '2026-09-03'
- id: transformer
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Transformer
  term_en: Transformer
  explanation_de: Die moderne Architektur, die paralleles Verarbeiten von Textzusammenhaengen erlaubt.
  explanation_en: The modern architecture that allows parallel processing of text context.
  context_de: Das „T“ in GPT.
  context_en: The "T" in GPT.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: attention-mechanismus
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Attention-Mechanismus
  term_en: Attention Mechanism
  explanation_de: Erlaubt der KI, die wichtigsten Teile einer Eingabe staerker zu gewichten.
  explanation_en: Lets the AI weight the most important parts of an input more heavily.
  context_de: Kerninnovation des Transformers.
  context_en: The core innovation of the Transformer.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: token
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Token
  term_en: Token
  explanation_de: Die Basiseinheit (Wortteile oder Silben), in die Text fuer die KI zerlegt wird.
  explanation_en: The basic unit (word pieces or syllables) that text is broken into for the AI.
  context_de: „Waehrung“ der KI-Verarbeitung.
  context_en: The "currency" of AI processing.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://digitaleneuordnung.de/blog/ki-begriffe
  updated: '2026-09-03'
- id: tokenisierung
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Tokenisierung
  term_en: Tokenization
  explanation_de: Der Prozess der Zerlegung von Text in einzelne Tokens.
  explanation_en: The process of splitting text into individual tokens.
  context_de: Erster Schritt der Textverarbeitung.
  context_en: The first step of text processing.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://digitaleneuordnung.de/blog/ki-begriffe
  updated: '2026-09-03'
- id: embeddings
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Embeddings
  term_en: Embeddings
  explanation_de: Umwandlung von Woertern in Zahlenreihen (Vektoren), um Bedeutung berechenbar zu machen.
  explanation_en: Converting words into rows of numbers (vectors) so meaning becomes computable.
  context_de: Basis fuer semantische Suche.
  context_en: The basis for semantic search.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://digitaleneuordnung.de/blog/ki-begriffe
  updated: '2026-09-03'
- id: rag
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: RAG
  term_en: Retrieval-Augmented Generation
  explanation_de: Die KI sucht vor der Antwort in externen Quellen (z.B. Internet), um Fakten zu pruefen.
  explanation_en: The AI looks up external sources (e.g. the internet) before answering, to check facts.
  context_de: Methode gegen Halluzinationen.
  context_en: A method against hallucinations.
  sources:
  - https://www.zendesk.de/blog/ai/generative-ai-glossary/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://www.youtube.com/watch?v=KI-Lernen
  updated: '2026-09-03'
- id: vektor-datenbank
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Vektor-Datenbank
  term_en: Vector Database
  explanation_de: Spezialisierte Datenbank, die Inhalte nach Bedeutung statt nach Schlagworten findet.
  explanation_en: A specialized database that finds content by meaning instead of by keywords.
  context_de: Essenziell fuer RAG-Systeme.
  context_en: Essential for RAG systems.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://digitaleneuordnung.de/blog/ki-begriffe
  updated: '2026-09-03'
- id: halluzination
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Halluzination
  term_en: Hallucination
  explanation_de: Die KI behauptet selbstbewusst falsche Fakten oder erfindet Quellen.
  explanation_en: The AI confidently states false facts or invents sources.
  context_de: Bekanntes Problem bei LLMs.
  context_en: A well-known problem with LLMs.
  sources:
  - https://mdai.ch/blog/von-llm-bis-halluzination/
  - https://digitalzentrum-berlin.de/blog/ki-glossar
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: kontext-fenster
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Kontext-Fenster
  term_en: Context Window
  explanation_de: Das „Kurzzeitgedaechtnis“ – wie viel Text die KI gleichzeitig verarbeiten kann.
  explanation_en: The "short-term memory" – how much text the AI can process at once.
  context_de: Begrenzt die Laenge von PDFs/Chats.
  context_en: Limits the length of PDFs/chats.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://www.youtube.com/watch?v=KI-Lernen
  updated: '2026-09-03'
- id: moe-/-sparse-models
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: MoE / Sparse Models
  term_en: Mixture of Experts (MoE)
  explanation_de: Architektur, bei der nur spezialisierte Teile eines Modells pro Anfrage aktiv sind.
  explanation_en: An architecture in which only specialized parts of a model are active per request.
  context_de: Macht riesige Modelle effizienter.
  context_en: Makes huge models more efficient.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: inferenz
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Inferenz
  term_en: Inference
  explanation_de: Die eigentliche Anwendung des fertigen Modells auf eine neue Frage.
  explanation_en: The actual use of the finished model on a new question.
  context_de: Phase nach dem Training [1.10].
  context_en: The phase after training.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  - https://www.din.de/resource/blob/772610/e96445ca1cbb372071981604ca9f07a2/normungsroadmap-ki-data.pdf
  updated: '2026-09-03'
- id: encoder
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Encoder
  term_en: Encoder
  explanation_de: Teil des Modells, der Input verarbeitet und Repraesentationen erstellt.
  explanation_en: The part of the model that processes input and builds representations.
  context_de: Teil der Transformer-Architektur.
  context_en: Part of the Transformer architecture.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: decoder
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Decoder
  term_en: Decoder
  explanation_de: Teil des Modells, der Output basierend auf Repraesentationen generiert.
  explanation_en: The part of the model that generates output based on representations.
  context_de: GPT nutzt primuer den Decoder.
  context_en: GPT primarily uses the decoder.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: softmax
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Softmax
  term_en: Softmax
  explanation_de: Mathematische Funktion, die Ausgaben in Wahrscheinlichkeiten umwandelt.
  explanation_en: A mathematical function that turns outputs into probabilities.
  context_de: Letzter Schritt vor der Token-Wahl.
  context_en: The last step before choosing a token.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: beam-search
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Beam Search
  term_en: Beam Search
  explanation_de: Algorithmus, der mehrere Textpfade parallel prueft, um das beste Ergebnis zu finden.
  explanation_en: An algorithm that checks several text paths in parallel to find the best result.
  context_de: Methode zur Textgenerierung.
  context_en: A method for text generation.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: latent-space
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Latent Space
  term_en: Latent Space
  explanation_de: Hochdimensionaler Raum, in dem das Netz seine internen Konzepte speichert.
  explanation_en: A high-dimensional space in which the network stores its internal concepts.
  context_de: Geometrie der Semantik.
  context_en: The geometry of meaning.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: flash-attention
  category: 2-technik,-architektur-and-sprachverarbeitung-nlp
  status: active
  term_de: Flash Attention
  term_en: Flash Attention
  explanation_de: Ein technischer Trick, der die Attention-Berechnung massiv beschleunigt.
  explanation_en: A technical trick that massively speeds up the attention calculation.
  context_de: Ermoeglicht riesige Kontextfenster.
  context_en: Enables huge context windows.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: pre-training
  category: 3-training,-anpassung-and-daten
  status: active
  term_de: Pre-Training
  term_en: Pre-training
  explanation_de: 'Die „Schulzeit“: Training auf Billionen von Texten fuer Weltwissen.'
  explanation_en: 'The "school years": training on trillions of texts to build world knowledge.'
  context_de: Erzeugt ein Foundation Model.
  context_en: Produces a foundation model.
  sources:
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: feinabstimmung
  category: 3-training,-anpassung-and-daten
  status: active
  term_de: Feinabstimmung
  term_en: Fine-tuning
  explanation_de: 'Die „Berufsausbildung“: Anpassung an Spezialaufgaben (z.B. Medizin).'
  explanation_en: 'The "vocational training": adapting a model to specialized tasks (e.g. medicine).'
  context_de: Schritt nach dem Pre-Training.
  context_en: A step after pre-training.
  sources:
  - https://mdai.ch/blog/von-llm-bis-halluzination/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: ueberwachtes-lernen
  category: 3-training,-anpassung-and-daten
  status: active
  term_de: Ueberwachtes Lernen
  term_en: Supervised Learning
  explanation_de: Lernen mit gelabelten Beispielen (Eingabe + richtige Ausgabe).
  explanation_en: Learning from labeled examples (input plus the correct output).
  context_de: Haeufigste ML-Methode.
  context_en: The most common ML method.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: unueberwachtes-lernen
  category: 3-training,-anpassung-and-daten
  status: active
  term_de: Unueberwachtes Lernen
  term_en: Unsupervised Learning
  explanation_de: Das System sucht eigenstaendig nach Mustern ohne Vorgaben.
  explanation_en: The system searches for patterns on its own, without labels.
  context_de: Genutzt fuer Clustering.
  context_en: Used for clustering.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: bestaerkendes-lernen
  category: 3-training,-anpassung-and-daten
  status: active
  term_de: Bestaerkendes Lernen
  term_en: Reinforcement Learning (RL)
  explanation_de: Lernen durch Belohnung und Bestrafung (Feedback) in einer Umgebung.
  explanation_en: Learning through reward and punishment (feedback) in an environment.
  context_de: Wichtig fuer Spiele/Robotik.
  context_en: Important for games and robotics.
  sources:
  - https://www.ki.nrw/ki-schluesselbegriffe/
  - https://www.webconsulting.at/blog/ki-kompendium-business-bildung-2025
  updated: '2026-09-03'
- id: verstaerkendes-lernen
  category: 3-training,-anpassung-and-daten
  status: active
  term_de: Verstärkendes Lernen
