- id: ov-rag-das-open-book-prinzip
  scope: overview
  type: image
  title_de: 'RAG: Das "Open-Book"-Prinzip'
  description_de: Die Grafik zeigt den dreistufigen Prozess, bei dem eine KI nicht nur aus ihrem Gedächtnis
    antwortet ("Closed-Book"), sondern wie ein Detektiv in einer externen Wissensbasis (z. B. Vektordatenbank)
    nachschlägt ("Open-Book")
  image_url: https://github.com/user-attachments/assets/25099eaf-39f1-4d1b-a984-32a69ecaa784
  title_en: 'RAG: The "Open-Book" Principle'
  description_en: The graphic shows the three-step process by which an AI does not just answer from memory
    ("closed-book"), but instead looks things up in an external knowledge base (e.g. a vector database)
    like a detective ("open-book").
