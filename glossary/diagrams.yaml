  file: glossary/diagrams/ov-vergleich-fine-tuning-vs-rag.mmd
  title_en: 'Comparison: Fine-Tuning vs. RAG'
  description_en: This diagram shows the difference between changing the model's "brain" (weights) and
    using a "cheat sheet" (context).
  file_en: glossary/diagrams/ov-vergleich-fine-tuning-vs-rag-en.mmd
