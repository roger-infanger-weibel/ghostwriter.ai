  file: glossary/diagrams/ov-agentic-ai-reasoning-loop-architektur.mmd
  quellen: '[dno](https://digitaleneuordnung.de/blog/ki-begriffe) [3.13, 3.51, 4.6, 4.7, 613]'
  title_en: Agentic AI & Reasoning (Loop Architecture)
  description_en: This diagram shows how **reasoning models** (such as o1) use external protocols (**MCP**)
