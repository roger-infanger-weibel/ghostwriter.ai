- id: ov-funktionsweise-proaktiver-ki-agenten
  scope: overview
  type: image
  title_de: Funktionsweise proaktiver KI-Agenten
  description_de: 'Diese Infografik verdeutlicht den Sprung vom reaktiven Chatbot zum proaktiven Agenten.
    Sie stellt den sogenannten Agent Loop dar: Ein Mensch gibt ein Ziel vor, woraufhin der Agent eigenständig
    plant, externe Werkzeuge (wie APIs oder Web-Suche) nutzt und seine Handlungen in einer Schleife aus
    Beobachten, Denken und Handeln kontinuierlich bewertet, bis das Ziel erreicht ist'
  image_url: https://github.com/user-attachments/assets/ab0a91e6-e987-402f-9ddc-af1518ed29bc
- id: ov-agentic-ai-reasoning-loop-architektur
  scope: overview
  type: mermaid
  title_de: Agentic AI & Reasoning (Loop-Architektur)
  description_de: Dieses Diagramm zeigt, wie **Reasoning-Modelle** (wie o1) externe Protokolle (**MCP**)
    und Werkzeuge (**Function Calling**) nutzen, um autonom zu handeln.
  file: glossary/diagrams/ov-agentic-ai-reasoning-loop-architektur.mmd
  quellen: '[dno](https://digitaleneuordnung.de/blog/ki-begriffe), [Felicia Simon](https://www.youtube.com/watch?v=KI-Lernen)
    [3.13, 3.51, 4.6, 4.7, 613]'
