# Podcast-Konfiguration – Single Source of Truth für Feed und Stimmen.
# Nach Änderungen: python podcast/tools/build_feed.py (oder beim nächsten Routine-Lauf).

title: "Rogers 3-Minuten-KI-Radar"
subtitle: "Die wichtigsten KI-News der Woche – Global, Europa, Schweiz"
description: >-
  Jede Woche ein kompakter Rückblick auf die wichtigsten Neuigkeiten zu Claude,
  ChatGPT, Gemini und NotebookLM sowie zu KI-Regulierung in Europa und der Schweiz.
  Recherche und Skript entstehen mit Claude, die Stimmen mit Gemini TTS.
  Alle Quellen stehen in den Shownotes.
author: "Roger Infanger Weibel"
language: "de-ch"
category: "Technology"
explicit: false

# Öffentliche Adresse (GitHub Pages, main /docs)
base_url: "https://roger-infanger-weibel.github.io/ghostwriter.ai/podcast"
cover_file: "cover.png"
website: "https://github.com/roger-infanger-weibel/ghostwriter.ai"

tts:
  # Modell-IDs: https://ai.google.dev/gemini-api/docs/speech-generation
  model: "gemini-3.8-flash-tts"
  # Max. Zeichen pro API-Aufruf; längere Skripte werden in Teile zerlegt.
  max_chars_per_request: 2000
  # Pause zwischen Aufrufen (Gratis-Kontingent hat tiefe Limits pro Minute)
  pause_seconds: 20
  # Genau zwei Sprecher (Limit der API pro Aufruf). Namen müssen im Skript so vorkommen.
  speakers:
    - name: "Lena"
      voice: "Kore"
      style: "sachlich, fründlech, ruhigs Tempo, redt Bärndütsch"
    - name: "Marc"
      voice: "Puck"
      style: "neugierig, locker, ruhigs Tempo, redt Bärndütsch"

audio:
  bitrate: "64k"
  # Startmusik vor jeder Folge (rein synthetisch, neu erzeugen: python podcast/tools/make_jingle.py)
  intro: "assets/intro-radar.wav"

# Ziellänge: fast 3 Minuten. ca. 15 Zeichen Sprache pro Sekunde (gemessen KW 35–47).
# build_episode.py warnt beim --dry-run, wenn das Skript ausserhalb liegt.
length:
  min_chars: 2400
  max_chars: 2800
