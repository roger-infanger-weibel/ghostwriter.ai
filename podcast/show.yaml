    shownotes_label: "Show notes and sources"
    cover_file: "cover-en.png"   # erzeugt mit podcast/tools/make_covers.py
    spotify_url: "https://open.spotify.com/show/06c7isJWADMvwYlrwEUqcq"
    apple_url: "https://podcasts.apple.com/us/podcast/%F0%9F%87%AC%F0%9F%87%A7-rogers-ai-radar-english/id6839994867"
