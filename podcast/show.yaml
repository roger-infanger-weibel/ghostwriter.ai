# Podcast-Konfiguration – Single Source of Truth für Feed und Stimmen.
# Nach Änderungen: python podcast/tools/build_feed.py (oder beim nächsten Routine-Lauf).

title: "🇨🇭 Rogers KI-Radar (Schweizerdeutsch)"
subtitle: "Di wichtigschte KI-News vo de Wuche – Global, Europa, Schwiiz"
description: >-
  De Podcast entstaht HOOTL (Human Out of the Loop): automatisierti KI-News-Aggregation – i öppe 3 Minute pro Wuche. De Inhalt wird vo KI-Agänte erstellt und vo KI-Persone verzellt. Gliederet: Global / Europa / Schwiiz / Neus im Radar.
author: "Roger Infanger Weibel"
# Kontakt-Adresse im Feed (itunes:owner) – nötig für die Verifizierung bei Spotify / Apple Podcasts
owner_email: "a470264@gmail.com"
# Podcast auf Spotify (Link auch auf docs/podcast/index.html)
spotify_url: "https://open.spotify.com/show/3C4tP9QIc022wpRr49xEsY"
# Text vor dem Link zu den Shownotes in jeder Folge (pro Sprache überschreibbar)
shownotes_label: "Shownotes und Quelle"
# Überschriften und Linktexte der Shownotes (Meldungen mit Links, siehe build_feed.py)
shownotes_labels:
  global: "Global"
  europa: "Europa"
  schweiz: "Schwiiz"
  radar: "Uf em Radar"
  none: "Kener Top-News"
  shownotes: "Ganzi Shownotes"
  sources: "Alli dursuechte Quelle"
  ai: "Recherchiert und gschribe vo KI-Agänte, gsproche vo KI-Stimme (HOOTL – Human Out of the Loop)."
# Apple Podcasts (Link auch auf docs/podcast/index.html)
apple_url: "https://podcasts.apple.com/us/podcast/%F0%9F%87%A8%F0%9F%87%AD-rogers-ki-radar-schweizerdeutsch/id6839993864"
language: "de-ch"
category: "Technology"
explicit: false

# Öffentliche Adresse (GitHub Pages, main /docs)
base_url: "https://roger-infanger-weibel.github.io/ghostwriter.ai/podcast"
cover_file: "cover.png"
website: "https://github.com/roger-infanger-weibel/ghostwriter.ai"

tts:
  # Modell-IDs: https://ai.google.dev/gemini-api/docs/speech-generation
  model: "gemini-3.8-flash-tts"
  # Max. Zeichen pro API-Aufruf; längere Skripte werden in Teile zerlegt.
  max_chars_per_request: 2000
  # Pause zwischen Aufrufen (Gratis-Kontingent hat tiefe Limits pro Minute)
  pause_seconds: 20
  # Genau zwei Sprecher (Limit der API pro Aufruf). Namen müssen im Skript so vorkommen.
  speakers:
    - name: "Lena"
      voice: "Kore"
      style: "sachlich, fründlech, ruhigs Tempo, redt Bärndütsch"
    - name: "Marc"
      voice: "Puck"
      style: "neugierig, locker, ruhigs Tempo, redt Bärndütsch"

audio:
  bitrate: "64k"
  # Startmusik vor jeder Folge (rein synthetisch, neu erzeugen: python podcast/tools/make_jingle.py)
  intro: "assets/intro-radar.wav"

# Ziellänge: fast 3 Minuten. ca. 15 Zeichen Sprache pro Sekunde (gemessen KW 35–47).
# build_episode.py warnt beim --dry-run, wenn das Skript ausserhalb liegt.
length:
  min_chars: 2400
  max_chars: 2800

# Weitere Sprachfassungen (ab KW 47). Schweizerdeutsch (be) nutzt die Werte oben unverändert:
# feed.xml, podcast/episodes.json, podcast/scripts/YYYY-Www.md, episodes/YYYY-Www.mp3.
# Aufruf: python podcast/tools/build_episode.py --week YYYY-Www --lang de|en
languages:
  de:
    title: "🇩🇪 Rogers KI-Radar (Deutsch)"
    subtitle: "Die wichtigsten KI-News der Woche – Global, Europa, Schweiz"
    description: >-
      Dieser Podcast entsteht HOOTL (Human Out of the Loop): automatisierte KI-News-Aggregation – in rund 3 Minuten pro Woche. Der Inhalt wird von KI-Agenten erstellt und von KI-Personen erzählt. Gegliedert: Global / Europa / Schweiz / Neues im Radar.
    language: "de"
    suffix: "-de"
    feed_file: "feed-de.xml"
    shownotes_labels:
      global: "Global"
      europa: "Europa"
      schweiz: "Schweiz"
      radar: "Auf dem Radar"
      none: "Keine Top-News"
      shownotes: "Ausführliche Shownotes"
      sources: "Alle durchsuchten Quellen"
      ai: "Recherchiert und geschrieben von KI-Agenten, gesprochen von KI-Stimmen (HOOTL – Human Out of the Loop)."
    shownotes_label: "Shownotes und Quellen"
    cover_file: "cover-de.png"   # erzeugt mit podcast/tools/make_covers.py
    spotify_url: "https://open.spotify.com/show/7ytNG2UAbV6zwNEaoxxWaY"
    apple_url: "https://podcasts.apple.com/us/podcast/%F0%9F%87%A9%F0%9F%87%AA-rogers-ki-radar-deutsch/id6839994962"
