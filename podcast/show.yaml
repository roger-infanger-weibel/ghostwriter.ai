# Podcast-Konfiguration – Single Source of Truth für Feed und Stimmen.
# Nach Änderungen: python podcast/tools/build_feed.py (oder beim nächsten Routine-Lauf).

title: "Rogers KI-Radar"
subtitle: "Die wichtigsten KI-News der Woche – Global, Europa, Schweiz"
description: >-
  Jede Woche ein kompakter Rückblick auf die wichtigsten Neuigkeiten zu Claude,
  ChatGPT, Gemini und NotebookLM sowie zu KI-Regulierung in Europa und der Schweiz.
  Recherche und Skript entstehen mit Claude, die Stimmen mit Gemini TTS.
  Alle Quellen stehen in den Shownotes.
author: "Roger Infanger Weibel"
# Kontakt-Adresse im Feed (itunes:owner) – nötig für die Verifizierung bei Spotify / Apple Podcasts
owner_email: "a470264@gmail.com"
# Podcast auf Spotify (Link auch auf docs/podcast/index.html)
spotify_url: "https://open.spotify.com/show/3C4tP9QIc022wpRr49xEsY"
language: "de-ch"
category: "Technology"
explicit: false

# Öffentliche Adresse (GitHub Pages, main /docs)
base_url: "https://roger-infanger-weibel.github.io/ghostwriter.ai/podcast"
cover_file: "cover.png"
website: "https://github.com/roger-infanger-weibel/ghostwriter.ai"

tts:
  # Modell-IDs: https://ai.google.dev/gemini-api/docs/speech-generation
  model: "gemini-3.8-flash-tts"
  # Max. Zeichen pro API-Aufruf; längere Skripte werden in Teile zerlegt.
  max_chars_per_request: 2000
  # Pause zwischen Aufrufen (Gratis-Kontingent hat tiefe Limits pro Minute)
  pause_seconds: 20
  # Genau zwei Sprecher (Limit der API pro Aufruf). Namen müssen im Skript so vorkommen.
  speakers:
    - name: "Lena"
      voice: "Kore"
      style: "sachlich, fründlech, ruhigs Tempo, redt Bärndütsch"
    - name: "Marc"
      voice: "Puck"
      style: "neugierig, locker, ruhigs Tempo, redt Bärndütsch"

audio:
  bitrate: "64k"
  # Startmusik vor jeder Folge (rein synthetisch, neu erzeugen: python podcast/tools/make_jingle.py)
  intro: "assets/intro-radar.wav"

# Ziellänge: fast 3 Minuten. ca. 15 Zeichen Sprache pro Sekunde (gemessen KW 35–47).
# build_episode.py warnt beim --dry-run, wenn das Skript ausserhalb liegt.
length:
  min_chars: 2400
  max_chars: 2800

# Weitere Sprachfassungen (ab KW 47). Berndeutsch (be) nutzt die Werte oben unverändert:
# feed.xml, podcast/episodes.json, podcast/scripts/YYYY-Www.md, episodes/YYYY-Www.mp3.
# Aufruf: python podcast/tools/build_episode.py --week YYYY-Www --lang de|en
languages:
  de:
    title: "Rogers KI-Radar (Deutsch)"
    subtitle: "Die wichtigsten KI-News der Woche – Global, Europa, Schweiz"
    description: >-
      Jede Woche ein kompakter Rückblick auf die wichtigsten KI-News – global, in Europa und
      in der Schweiz – auf Hochdeutsch. Recherche und Skript entstehen mit Claude, die
      Stimmen mit Gemini TTS. Alle Quellen stehen in den Shownotes.
    language: "de"
    suffix: "-de"
    feed_file: "feed-de.xml"
    spotify_url: ""   # Link folgt; auch in docs/podcast/index.html (LANGS) eintragen
    episodes_file: "episodes-de.json"
    scripts_dir: "scripts/de"
    styles:
      Lena: "sachlich, freundlich, ruhiges Tempo, Hochdeutsch mit leichtem Schweizer Akzent"
      Marc: "neugierig, locker, ruhiges Tempo, Hochdeutsch mit leichtem Schweizer Akzent"
    # Hochdeutsch braucht für denselben Inhalt mehr Zeichen (KW 47: 2958 Zeichen = 3:11)
    length:
      min_chars: 2500
      max_chars: 2950
  en:
    title: "Roger's AI Radar (English)"
    subtitle: "The week's most important AI news – global, Europe, Switzerland"
    description: >-
      A compact weekly round-up of the most important AI news – global, in Europe and in
      Switzerland – in English. Research and script are made with Claude, the voices with
      Gemini TTS. All sources are in the show notes.
    language: "en"
    suffix: "-en"
    feed_file: "feed-en.xml"
    spotify_url: ""   # Link folgt; auch in docs/podcast/index.html (LANGS) eintragen
    episodes_file: "episodes-en.json"
    scripts_dir: "scripts/en"
    styles:
      Lena: "factual, friendly, calm pace, clear international English"
      Marc: "curious, relaxed, calm pace, clear international English"
    # KW 47: 2727 Zeichen = 3:01
    length:
      min_chars: 2400
      max_chars: 2850
